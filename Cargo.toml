[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-std = { version = "1", features = ["attributes"] }
futures = "0.3"
url = "2"
log = "0.4"
async-tungstenite = { version = "0.35", features = ["async-std-runtime", "async-native-tls"] }
surf = { version = "2", default-features = false, features = ["h1-client-rustls"] }
