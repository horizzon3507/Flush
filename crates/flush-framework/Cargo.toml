[package]
name = "flush-framework"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Flush prefix command framework (router, typed arguments, middleware, collectors, scheduler, per-server config)"

[dependencies]
flush-core = { path = "../flush-core", version = "0.2.0" }
flush-gateway = { path = "../flush-gateway", version = "0.2.0" }
flush-rest = { path = "../flush-rest", version = "0.2.0" }
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror.workspace = true
async-std.workspace = true
futures.workspace = true
log.workspace = true
toml.workspace = true
fs4.workspace = true
rusqlite = { workspace = true, optional = true }

[features]
default = ["sqlite"]
sqlite = ["dep:rusqlite"]

[dev-dependencies]
rusqlite.workspace = true

[[test]]
name = "sqlite"
required-features = ["sqlite"]
